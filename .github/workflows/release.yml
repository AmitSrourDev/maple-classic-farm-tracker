name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyflakes

      - name: Stamp version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          python - "$VER" <<'PY'
          import re, sys, pathlib
          p = pathlib.Path("version.py"); s = p.read_text()
          p.write_text(re.sub(r'__version__ = "[^"]+"', f'__version__ = "{sys.argv[1]}"', s))
          PY
          grep __version__ version.py

      - name: Lint + unit tests
        run: |
          python -m pyflakes maple_hud.py maple_exp.py maple_slots.py maple_build.py meowdb.py updater.py app_paths.py webview_login.py
          python tests/test_session.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean MapleFarmTracker.spec

      - name: Smoke test the built exe
        run: |
          dist\MapleFarmTracker\MapleFarmTracker-console.exe --version
          dist\MapleFarmTracker\MapleFarmTracker-console.exe --selftest

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ env.VER }}" installer\installer.iss'

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType File -Path dist\MapleFarmTracker\portable.txt -Force | Out-Null
          Compress-Archive -Path dist\MapleFarmTracker -DestinationPath "dist\MapleFarmTracker-${{ env.VER }}-windows-portable.zip"

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location dist
          $files = @("MapleFarmTracker-Setup-${{ env.VER }}.exe", "MapleFarmTracker-${{ env.VER }}-windows-portable.zip")
          Get-FileHash $files -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MapleFarmTracker-Setup-${{ env.VER }}.exe
            dist/MapleFarmTracker-${{ env.VER }}-windows-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
